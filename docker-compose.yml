services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Брокер сообщений Redis
  redis:
    image: redis:7-alpine
    restart: always

  # 3. Бэкенд Django (запуск через Daphne) build: ./backend
  backend:
    build:
      context: .           # Было ./backend, поставьте . (точка - это корень)
      dockerfile: backend/Dockerfile
    # ✅ Явный тег образа (а не то, что compose придумает сам по имени папки) —
    # celery-worker/celery-beat ниже ссылаются на этот же ТЕГ вместо своей
    # отдельной сборки (у них тот же Dockerfile/код). Значит для офлайн-переноса
    # на новый ПК ничего нового сохранять/грузить не нужно — существующий
    # backend-erp.tar (docker save -o backend-erp.tar my_erp-backend:latest)
    # уже покрывает и celery — это буквально тот же образ.
    image: my_erp-backend:latest
    restart: always
    # ✅ migrate_schemas (без --shared) обязателен ДО init_tenant.py — иначе
    # миграции, добавленные ПОСЛЕ первого создания тенанта, ещё не будут
    # применены к уже существующим схемам тенантов в момент, когда
    # init_tenant.py начнёт сеять/читать данные через ORM (новый тенант при
    # создании мигрируется автоматически через auto_create_schema — для него
    # порядок не важен, а вот для уже существующего тенанта важен: раньше
    # именно из-за обратного порядка init_tenant.py падал на несуществующей
    # колонке при повторном деплое с новой миграцией).
    command: >
      sh -c "python manage.py migrate_schemas --shared --noinput &&
            python manage.py migrate_schemas --noinput &&
            python init_tenant.py &&
            python manage.py sync_permissions &&
            python manage.py bootstrap_daily_checks_schedule &&
            python manage.py collectstatic --noinput &&
            exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    # ✅ Без bind-mount'а ./backend:/app — код уже "запечён" в образ на этапе
    # build (COPY . .). Значит перенос на офлайн-хост = только .tar образа +
    # этот compose-файл + .env, БЕЗ копирования папки backend/ целиком.
    # Именованные тома ниже — не код, а персистентные данные (статика/медиа).
    volumes:
      - django_static:/app/static
      - django_media:/app/media

    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DJANGO_DEBUG}
      - PROJECT_DOMAIN=${PROJECT_DOMAIN}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Прокидываем креды админа tenant внутрь контейнера:
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD} 
      - COMPANY_SCHEME=${COMPANY_SCHEME}
      # global admin
      - DJANGO_SAAS_SUPERUSER_PASSWORD=${DJANGO_SAAS_SUPERUSER_PASSWORD}
      - DJANGO_SAAS_SUPERUSER_LOGIN=${DJANGO_SAAS_SUPERUSER_LOGIN} 
      - DJANGO_SAAS_SUPERUSER_EMAIL=${DJANGO_SAAS_SUPERUSER_EMAIL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      redis:
        condition: service_started
      # Теперь бэкенд будет ждать, пока база не пройдет healthcheck
      db:
        condition: service_healthy

  celery-worker:
    # ✅ Без своего build: — использует уже собранный тег my_erp-backend:latest
    # (см. комментарий у backend выше). Docker Compose соберёт его один раз
    # (по инструкции у backend), а не три раза под три разных тега.
    image: my_erp-backend:latest
    restart: always
    command: celery -A config worker -l info
    volumes:
      - django_media:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DJANGO_DEBUG}
      - PROJECT_DOMAIN=${PROJECT_DOMAIN}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    # ✅ Тот же тег, что и backend/celery-worker — см. комментарий выше.
    image: my_erp-backend:latest
    restart: always
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DJANGO_DEBUG}
      - PROJECT_DOMAIN=${PROJECT_DOMAIN}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # Генерация SSL сертификата (запускается один раз)
  ssl-gen:
    # image: alpine/openssl
    image: alpine/openssl:3.3.1
    volumes:
      - ./nginx/ssl:/ssl
    # ✅ Образ alpine/openssl:3.3.1 имеет ENTRYPOINT ["openssl"] — без переопределения
    # entrypoint команда "sh -c ..." выполнялась бы как "openssl sh -c ...", что
    # невалидно. Явно переопределяем entrypoint на sh, чтобы command был shell-скриптом.
    # ✅ command задан СПИСКОМ из одного элемента — иначе Compose сам разбивает
    # многострочную строку на отдельные shell-слова по переносам строк, обрывая
    # скрипт на первой строке (без кавычек-обёртки нет группировки в один токен).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /ssl/nginx.crt ]; then
          echo 'Generating SSL certificate...'
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/nginx.key \
            -out /ssl/nginx.crt \
            -subj '/CN=${PROJECT_DOMAIN}'
          echo 'SSL certificate generated!'
        else
          echo 'SSL certificate already exists, skipping...'
        fi

  dns:
    image: jpillora/dnsmasq
    restart: always
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN

  # 4. Фронтенд + Маршрутизатор Nginx
  nginx:
    build: ./frontend
    restart: always
    ports:
      - "8100:80"
      - "8101:443"
    volumes:
      # Прокидываем конфиг Nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Прокидываем сгенерированные нами SSL сертификаты
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Делимся объемами статики и медиа из контейнера Django с Nginx
      - django_static:/app/backend_static:ro
      - django_media:/app/backend_media:ro
    depends_on:
      - backend
      - ssl-gen

volumes:
  postgres_data:
  django_static:
  django_media: